[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[profile.release]
lto = "thin"
codegen-units = 4
debug = 1

# Audio code is unusably slow unoptimised; keep dev builds fast enough to listen to.
[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3
