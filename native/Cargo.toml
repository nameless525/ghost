[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[profile.release]
# Whole-program LTO in one unit: a ~20% smaller addon (same speed as thin LTO; ~1 min more to build).
lto = "fat"
codegen-units = 1
debug = 1

# Audio code is unusably slow unoptimised; keep dev builds fast enough to listen to.
[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3
