[package]
name = "ghost-cli"
edition.workspace = true
version.workspace = true

[[bin]]
name = "ghost-cli"
path = "src/main.rs"

[dependencies]
ghost-engine = { path = "../ghost-engine" }
ghost-analysis = { path = "../ghost-analysis" }
clap = { version = "4.6", features = ["derive"] }
serde_json = "1"
crossbeam-channel = "0.5"
