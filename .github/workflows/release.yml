name: Release

# Push a version tag (git tag v0.3.3 && git push origin v0.3.3) to build installers for
# macOS, Windows and Linux and publish them as a GitHub release. Run it by hand from the
# Actions tab to build the installers without publishing (they're kept as workflow artifacts).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    uses: ./.github/workflows/ci.yml

  build:
    name: Build (${{ matrix.name }})
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            target: --mac
            app: mac-arm64/GHOST.app/Contents/MacOS/GHOST
          - name: Windows
            os: windows-latest
            target: --win
            app: win-unpacked/GHOST.exe
          # The oldest supported Ubuntu, so the AppImage runs on older distributions too.
          - name: Linux
            os: ubuntu-22.04
            target: --linux
            app: linux-unpacked/ghost
            display: xvfb-run -a
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native -> target/bindings
      - name: Install ALSA headers (and a virtual display for the launch check)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev xvfb
      - run: npm ci
      - run: npm run build:native
      - run: npx electron-vite build
      - run: npx electron-builder ${{ matrix.target }} --publish never
      # Open the app that was just built: its window, catalog and audio engine must come up.
      - name: Launch check
        shell: bash
        run: ${{ matrix.display }} node scripts/smoke/launch.mjs release/*/${{ matrix.app }}
      - uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.name }}
          if-no-files-found: error
          path: |
            release/*/*.dmg
            release/*/*.exe
            release/*/*.AppImage
            release/*/*.deb

  publish:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Release notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## " v "( |$)" { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          printf '\n---\n\n**Install:** download the file for your system below. First launch on macOS, Windows or Linux: see the [README](https://github.com/%s#install).\n' "$GITHUB_REPOSITORY" >> notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The artifacts keep their release/<version>/ folders: upload the installers themselves.
          files=()
          while IFS= read -r f; do files+=("$f"); done < <(find dist -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' \) | sort)
          if [ "${#files[@]}" -ne 4 ]; then
            echo "expected 4 installers, found ${#files[@]}: ${files[*]}"
            exit 1
          fi
          # Checksums of the installers (GHOST's updater checks its download against GitHub's own
          # digest of the file, or this list when that's missing).
          for f in "${files[@]}"; do (cd "$(dirname "$f")" && sha256sum "$(basename "$f")"); done > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" "${files[@]}" SHA256SUMS \
            --verify-tag \
            --title "GHOST ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md
